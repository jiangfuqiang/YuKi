name: YuKi
options:
  bundleIdPrefix: com.localfirst
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  YuKi:
    type: application
    platform: iOS
    info:
      path: YuKi/Info.plist
      properties:
        CFBundleDisplayName: YuKi
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 需要使用麦克风进行口语对话
        NSSpeechRecognitionUsageDescription: 需要将你的语音转换为文字
    sources:
      - path: YuKi
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localfirst.yuki
        PRODUCT_NAME: YuKi
        INFOPLIST_KEY_CFBundleDisplayName: YuKi
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要使用麦克风进行口语对话
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 需要将你的语音转换为文字
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LIBRARY_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/WhisperCpp/lib-ios"
          - "$(PROJECT_DIR)/Vendor/DeepFilterNet/lib-ios"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/Llama"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lwhisper"
          - "-lggml"
          - "-lggml-base"
          - "-lggml-cpu"
          - "-lggml-blas"
          - "-lggml-metal"
          - "-ldf"
          - "-lc++"
          - "-framework Accelerate"
          - "-framework Metal"
          - "-framework MetalKit"
    dependencies:
      - target: WhisperCpp
      - target: DeepFilterNet
      - target: LlamaBridge
      - framework: Vendor/Llama/llama.framework
        embed: true
    scheme:
      testTargets:
        - YuKiUITests
  YuKiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YuKiUITests
    dependencies:
      - target: YuKi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localfirst.yuki.uitests
        TEST_TARGET_NAME: YuKi
        GENERATE_INFOPLIST_FILE: YES
  WhisperCpp:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/WhisperCpp/src
      - path: Vendor/WhisperCpp/include
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_MODULE_NAME: WhisperCpp
        DEFINES_MODULE: YES
        MODULEMAP_FILE: "$(PROJECT_DIR)/Vendor/WhisperCpp/include/module.modulemap"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/WhisperCpp/include"
        SKIP_INSTALL: YES
  DeepFilterNet:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/DeepFilterNet/src
      - path: Vendor/DeepFilterNet/include
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_MODULE_NAME: DeepFilterNet
        DEFINES_MODULE: YES
        MODULEMAP_FILE: "$(PROJECT_DIR)/Vendor/DeepFilterNet/include/module.modulemap"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/DeepFilterNet/include"
        SKIP_INSTALL: YES
  LlamaBridge:
    type: library.static
    platform: iOS
    sources:
      - path: Vendor/LlamaBridge/src
      - path: Vendor/LlamaBridge/include
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_MODULE_NAME: LlamaBridge
        DEFINES_MODULE: YES
        MODULEMAP_FILE: "$(PROJECT_DIR)/Vendor/LlamaBridge/include/module.modulemap"
        HEADER_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/LlamaBridge/include"
        FRAMEWORK_SEARCH_PATHS:
          - "$(PROJECT_DIR)/Vendor/Llama"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework llama"
          - "-lc++"
        SKIP_INSTALL: YES
